name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # billy targets linux, darwin and windows equally — a change that only
    # passes on one OS is not done. The matrix is the proof, so it is not
    # allowed to fail fast: a Windows-only failure must still be visible
    # alongside a green Linux run. Building here rather than in a separate
    # cross-compile job is deliberate: the matrix already covers every GOOS
    # billy releases for, natively.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true

      # No go-version/go-version-file: setup-go then installs nothing and only
      # wires the module and build caches around the toolchain mise put on PATH.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache-dependency-path: go.sum

      - name: Build
        run: just build

      - name: Run tests
        run: just test

      - name: Run race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache-dependency-path: go.sum

      - name: Run linter
        run: just lint
