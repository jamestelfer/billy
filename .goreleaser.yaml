# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# Names the archives and the Nix package. Without it, goreleaser uses the
# repository name.
project_name: billy

builds:
  - id: release
    binary: billy
    main: .
    flags:
      - "-trimpath"
    ldflags:
      - "-w -s"
      - "-X main.version={{.Version}}"
      - "-X main.commit={{.Commit}}"
      - "-X main.date={{.Date}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

archives:
  - id: archives
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

nix:
  - name: billy
    repository:
      owner: jamestelfer
      name: nixpkgs
      token: "{{ .Env.NIX_GITHUB_TOKEN }}" # set by the release workflow
    # Leave the committer unset, so GitHub signs the commit as the token's App.
    commit_author:
      use_github_app_token: true
    skip_upload: auto # no recipe for prerelease tags
    homepage: "https://github.com/jamestelfer/billy"
    description: "Audiobookshelf skill for Amazon Alexa"
    license: "asl20"

release:
  # The shared pipeline requires the release to stay a draft that goreleaser
  # fills in place: release-please creates the draft, attestation runs, then the
  # wrapper publishes. Nothing downloadable exists without provenance behind it.
  draft: true
  # release-please creates the draft, but the tag is pushed separately so the
  # draft has no published tag association. goreleaser's default lookup
  # (GetReleaseByTag) cannot see draft releases and would create a duplicate;
  # use_existing_draft makes it locate the draft by name and fill it instead.
  use_existing_draft: true
  # Lets a re-run replace assets an earlier run uploaded, instead of failing
  # with HTTP 422 on the first existing asset.
  replace_existing_artifacts: true
  mode: keep-existing # keep the release-please title and notes
  prerelease: auto
